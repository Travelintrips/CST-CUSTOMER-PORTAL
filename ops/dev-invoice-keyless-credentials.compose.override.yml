# Optional CST-DEV ONLY. Do not apply until a verified encrypted artifact
# has provisioned this directory on VPS tmpfs and activation is approved.
# Adds only a read-only credential mount; no new service or Finance flags.
services:
  customer-portal-dev:
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/cst-customer-portal-dev.service
    volumes:
      - type: bind
        source: ${CST_INVOICE_DEV_CREDENTIAL_DIRECTORY:?require_preprovisioned_readonly_invoice_credential_dir}
        target: /run/credentials/cst-customer-portal-dev.service
        read_only: true
        bind:
          create_host_path: false
