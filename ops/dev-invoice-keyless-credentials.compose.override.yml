# Optional CST-DEV ONLY, use only after approved credential activation.
# NEVER mount plaintext host files. Host GitHub runner uses UID/GID 1000.
# A private container tmpfs is populated by a root-only encrypted pipe.
services:
  customer-portal-dev:
    user: "21110:21110"
    environment:
      CREDENTIALS_DIRECTORY: /run/credentials/cst-customer-portal-dev.service
    tmpfs:
      - /run/credentials/cst-customer-portal-dev.service:rw,nosuid,nodev,noexec,size=65536,mode=0700,uid=21110,gid=21110
