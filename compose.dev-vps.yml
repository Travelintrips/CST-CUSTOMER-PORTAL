services:
  customer-portal-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev-vps
      args:
        DEV_RELEASE_SHA: ${DEV_RELEASE_SHA:-dev-vps}
    image: cst-customer-portal-dev:local
    container_name: cst-customer-portal-dev
    restart: unless-stopped
    env_file:
      - /etc/cst-customer-portal-dev/runtime.env
    environment:
      APP_ENV: development
      NODE_ENV: development
      PORT: "18444"
      PORTAL_DEV_BIND_HOST: "127.0.0.1"
      CUSTOMER_PORTAL_DEV_DIRECT_IPV6: "true"
      PORTAL_RELEASE_ID: ${DEV_RELEASE_SHA:-dev-vps}
    network_mode: host
    mem_limit: 1536m
    cpus: 0.75
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # Reviewed public Accounting code only. Never mount credentials or DB sockets.
    # The runtime's SHA-pinned loader refuses any file substitution.
    volumes:
      - type: bind
        source: ./scripts/start-dev-vps.mjs
        target: /app/scripts/start-dev-vps.mjs
        read_only: true
      - type: bind
        source: ./server/index.mjs
        target: /app/server/index.mjs
        read_only: true
      - type: bind
        source: ./server/db.mjs
        target: /app/server/db.mjs
        read_only: true
      - type: bind
        source: /opt/cst-customer-invoice-owner-bundle-dev
        target: /opt/cst-customer-invoice-owner-bundle-dev
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18444/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
