name: Production Verify

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-production:
    name: Verify Hostinger production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for latest release marker
        shell: bash
        run: |
          set -euo pipefail
          url="https://cstlogistic.co.id/api/portal/release-info"
          expected_sha="${GITHUB_SHA}"

          for attempt in $(seq 1 40); do
            echo "Attempt ${attempt}/40"
            body="$(curl --fail --silent --show-error --max-time 15 "$url" || true)"
            release_id="$(printf '%s' "$body" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try { process.stdout.write(String(JSON.parse(input).releaseId ?? "")); }
                catch { process.stdout.write(""); }
              });
            ')"
            if [ "$release_id" = "$expected_sha" ]; then
              echo "Customer Portal release ${expected_sha} is live on Hostinger."
              exit 0
            fi
            sleep 15
          done

          echo "Production did not expose release ${expected_sha}."
          curl -i --max-time 20 "$url" || true
          exit 1

      - name: Verify new release is ready and front door is stable
        shell: bash
        run: |
          set -euo pipefail
          ready_url="https://cstlogistic.co.id/api/readyz"
          home_url="https://cstlogistic.co.id/"

          for attempt in $(seq 1 12); do
            ready_code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' --max-time 15 "$ready_url" || true)"
            home_code="$(curl --silent --show-error --output /tmp/home.html --write-out '%{http_code}' --max-time 15 "$home_url" || true)"
            echo "stability attempt=$attempt ready=$ready_code home=$home_code"

            if [ "$ready_code" = "200" ] && [ "$home_code" = "200" ]; then
              grep -Fq '"status":"ready"' /tmp/ready.json
              grep -Fq '<!doctype html>' /tmp/home.html
            else
              echo "Release is not stable yet."
              cat /tmp/ready.json 2>/dev/null || true
              sleep 5
              continue
            fi

            # Require three consecutive successful probes to catch restart flapping.
            if [ "$attempt" -ge 3 ]; then
              echo "Release readiness and front door are stable."
              exit 0
            fi
            sleep 5
          done

          echo "Release failed readiness/front-door stability verification."
          exit 1

      - name: Verify canonical services are exposed
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 https://cstlogistic.co.id/api/portal/services)"
          compact="$(printf '%s' "$body" | tr -d '[:space:]')"
          for code in sea_freight air_freight trucking customs_clearance ppjk_consulting handling port_charges storage_demurrage emkl cargo_insurance; do
            printf '%s' "$compact" | grep -Fq "\"code\":\"$code\"" || {
              echo "Missing canonical service: $code"
              exit 1
            }
          done
          echo "All 10 canonical services are live."


      - name: Verify public sitemap
        shell: bash
        run: |
          set -euo pipefail
          url="https://cstlogistic.co.id/sitemap.xml"
          code="$(curl --silent --show-error --dump-header /tmp/sitemap-headers --output /tmp/sitemap.xml --write-out '%{http_code}' \
            --max-time 20 \
            -H 'User-Agent: Googlebot' \
            "$url")"
          content_type="$(awk -F': ' 'tolower($1)=="content-type" {gsub("\r","",$2); print tolower($2)}' /tmp/sitemap-headers | tail -n1)"

          echo "sitemap_http=$code content_type=${content_type:-missing}"
          test "$code" = "200"
          case "$content_type" in
            application/xml*|text/xml*) ;;
            *)
              echo "Unexpected sitemap Content-Type: ${content_type:-missing}"
              cat /tmp/sitemap-headers
              exit 1
              ;;
          esac

          grep -Fq '<urlset' /tmp/sitemap.xml
          grep -Fq '<loc>https://cstlogistic.co.id/kalkulator-impor</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://cstlogistic.co.id/translation-hub</loc>' /tmp/sitemap.xml

          url_count="$(grep -o '<url>' /tmp/sitemap.xml | wc -l | tr -d ' ')"
          echo "sitemap_url_count=$url_count"
          test "$url_count" = "15"
          ! grep -Fq '<loc>https://cstlogistic.co.id/services</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://cstlogistic.co.id/jasa</loc>' /tmp/sitemap.xml

          echo "Public sitemap is live with 15 canonical URLs and /jasa as the service hub."

      - name: Verify Paylabs routes are locally owned and fail closed
        shell: bash
        run: |
          set -euo pipefail

          webhook_status="$(curl --silent --show-error --output /tmp/paylabs-webhook.json --write-out '%{http_code}' \
            --max-time 20 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{}' \
            https://cstlogistic.co.id/api/payments/paylabs/webhook)"
          if [ "$webhook_status" != "401" ]; then
            echo "Expected unsigned Paylabs webhook to fail closed with 401, got $webhook_status"
            cat /tmp/paylabs-webhook.json || true
            exit 1
          fi

          config_status="$(curl --silent --show-error --output /tmp/paylabs-config.json --write-out '%{http_code}' \
            --max-time 20 \
            https://cstlogistic.co.id/api/payments/paylabs/config)"
          if [ "$config_status" != "401" ]; then
            echo "Expected unauthenticated Paylabs config to return 401, got $config_status"
            cat /tmp/paylabs-config.json || true
            exit 1
          fi

          echo "Paylabs webhook and admin routes are live and fail closed."


      - name: Verify Marketplace admin diagnostics fail closed
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/mkt-queue-stats.json --write-out '%{http_code}' \
            --max-time 20 \
            https://cstlogistic.co.id/api/mkt/admin/notification-queue/stats)"
          if [ "$status" != "401" ]; then
            echo "Expected unauthenticated Marketplace queue diagnostics to return 401, got $status"
            cat /tmp/mkt-queue-stats.json || true
            exit 1
          fi
          echo "Marketplace queue diagnostics are admin-protected."
