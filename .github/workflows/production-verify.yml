name: Production Verify

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-production:
    name: Verify Hostinger production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for latest release marker
        shell: bash
        run: |
          set -euo pipefail
          url="https://cstlogistic.co.id/api/portal/release-info"
          expected_sha="${GITHUB_SHA}"

          for attempt in $(seq 1 40); do
            echo "Attempt ${attempt}/40"
            body="$(curl --fail --silent --show-error --max-time 15 "$url" || true)"
            release_id="$(printf '%s' "$body" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try { process.stdout.write(String(JSON.parse(input).releaseId ?? "")); }
                catch { process.stdout.write(""); }
              });
            ')"
            if [ "$release_id" = "$expected_sha" ]; then
              echo "Customer Portal release ${expected_sha} is live on Hostinger."
              exit 0
            fi
            sleep 15
          done

          echo "Production did not expose release ${expected_sha}."
          curl -i --max-time 20 "$url" || true
          exit 1

      - name: Verify canonical services are exposed
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 https://cstlogistic.co.id/api/portal/services)"
          compact="$(printf '%s' "$body" | tr -d '[:space:]')"
          for code in sea_freight air_freight trucking customs_clearance ppjk_consulting handling port_charges storage_demurrage emkl cargo_insurance; do
            printf '%s' "$compact" | grep -Fq "\"code\":\"$code\"" || {
              echo "Missing canonical service: $code"
              exit 1
            }
          done
          echo "All 10 canonical services are live."


      - name: Verify Paylabs routes are locally owned and fail closed
        shell: bash
        run: |
          set -euo pipefail

          webhook_status="$(curl --silent --show-error --output /tmp/paylabs-webhook.json --write-out '%{http_code}' \
            --max-time 20 \
            -H 'Content-Type: application/json' \
            -X POST \
            --data '{}' \
            https://cstlogistic.co.id/api/payments/paylabs/webhook)"
          if [ "$webhook_status" != "401" ]; then
            echo "Expected unsigned Paylabs webhook to fail closed with 401, got $webhook_status"
            cat /tmp/paylabs-webhook.json || true
            exit 1
          fi

          config_status="$(curl --silent --show-error --output /tmp/paylabs-config.json --write-out '%{http_code}' \
            --max-time 20 \
            https://cstlogistic.co.id/api/payments/paylabs/config)"
          if [ "$config_status" != "401" ]; then
            echo "Expected unauthenticated Paylabs config to return 401, got $config_status"
            cat /tmp/paylabs-config.json || true
            exit 1
          fi

          echo "Paylabs webhook and admin routes are live and fail closed."
