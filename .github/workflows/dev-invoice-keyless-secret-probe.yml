name: CST Invoice DEV — keyless Secret Manager IAM proof

on:
  push:
    branches:
      - test/dev-customer-invoice-gcp-secret-reader-20261119
    paths:
      - .github/workflows/dev-invoice-keyless-secret-probe.yml

permissions:
  contents: read
  id-token: write

jobs:
  proof-no-static-service-account-key:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/test/dev-customer-invoice-gcp-secret-reader-20261119' &&
      github.repository == 'Travelintrips/CST-CUSTOMER-PORTAL' &&
      github.event.repository.id == 1369747600
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch-only source
        uses: actions/checkout@v4

      - name: Google Cloud keyless OAuth via strictly scoped GitHub OIDC
        id: keyless
        uses: google-github-actions/auth@v3
        with:
          project_id: secret-504012
          workload_identity_provider: projects/653506647312/locations/global/workloadIdentityPools/fleet-dev-github/providers/customer-invoice-dev-oidc
          service_account: bizportal-invoice-dev-reader@secret-504012.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify resource-only permissions without reading secrets
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.keyless.outputs.access_token }}
        run: |
          set -euo pipefail
          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "NO_KEYLESS_ACCESS_TOKEN"; exit 1
          fi
          p='projects/653506647312/secrets'
          permissions='{"permissions":["secretmanager.versions.access","secretmanager.versions.add"]}'
          invoice_response="$(curl --fail-with-body -sS --max-time 20 \
            -X POST "https://secretmanager.googleapis.com/v1/$p/bizportal-customer-invoice-writers-dev-companies:testIamPermissions" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$permissions")"
          finance_response="$(curl --fail-with-body -sS --max-time 20 \
            -X POST "https://secretmanager.googleapis.com/v1/$p/bizportal-marketplace-finance-dev-companies:testIamPermissions" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$permissions")"
          INVOICE_PERMISSIONS="$invoice_response" FINANCE_PERMISSIONS="$finance_response" python3 - <<'PY'
          import json, os
          own = set(json.loads(os.environ['INVOICE_PERMISSIONS']).get('permissions', []))
          other = set(json.loads(os.environ['FINANCE_PERMISSIONS']).get('permissions', []))
          assert 'secretmanager.versions.access' in own, 'dedicated Invoice read missing'
          assert 'secretmanager.versions.add' not in own, 'Invoice write wrongly allowed'
          assert not other, 'dedicated Invoice identity gained Finance secret access'
          print('WIF_KEYLESS_INVOICE_ONLY_PERMISSIONS_PASS')
          print('NO_SECRET_PAYLOAD_READ')
          print('NO_SERVICE_ACCOUNT_KEY_CREATED')
          PY

      - name: Encrypt synthetic envelope for VPS only — zero secrets
        shell: bash
        run: |
          set -euo pipefail
          cert="scripts/dev-invoice-envelope-recipient.pem"
          test -s "$cert"
          expected="38a9abcbbcca3535601265ae2c9a8a4b574f90767b5fe83291d38bf4513cb334"
          actual="$(openssl x509 -in "$cert" -outform DER | sha256sum | cut -d' ' -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "PUBLIC_RECIPIENT_CERT_FINGERPRINT_MISMATCH"; exit 1
          fi
          dir="$RUNNER_TEMP/cst-invoice-dev-envelope-qa"
          install -d -m 0700 "$dir"
          # QA-only fixed syntactically valid DSNs with impossible placeholder passwords.
          # No Secret Manager data and no real PostgreSQL credentials are read.
          printf '%s' '{"APP_ENV":"development","SUPABASE_PROJECT_REF":"xssrfshdrtdfupgqwfdw","CUSTOMER_PORTAL_CST_INVOICE_WRITER_DSN_DEV":"postgresql://bizportal_customer_invoice_cst_writer_dev.xssrfshdrtdfupgqwfdw:synthetic-only-qa@aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslrootcert=/opt/cst-dev-finance-tls/supabase-root-2021.crt","CUSTOMER_PORTAL_DIVA_INVOICE_WRITER_DSN_DEV":"postgresql://bizportal_customer_invoice_diva_writer_dev.xssrfshdrtdfupgqwfdw:synthetic-only-qa@aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslrootcert=/opt/cst-dev-finance-tls/supabase-root-2021.crt"}' \
            | openssl cms -encrypt -binary -aes-256-gcm \
                -in /dev/stdin -out "$dir/invoice-envelope.cms" -outform DER "$cert"
          test -s "$dir/invoice-envelope.cms"
          sum="$(sha256sum "$dir/invoice-envelope.cms" | cut -d' ' -f1)"
          printf '{"qa_only":true,"source_sha":"%s","certificate_sha256":"%s","envelope_sha256":"%s","format":"CMS-AES-256-GCM"}\n' \
            "$GITHUB_SHA" "$expected" "$sum" > "$dir/invoice-envelope-manifest.json"
          echo "SYNTHETIC_ENCRYPTED_ENVELOPE_CREATED"
          echo "NO_PLAINTEXT_ARTIFACT_OR_DATABASE_PASSWORD"

      - name: Upload ciphertext-only artifact with one-day retention
        uses: actions/upload-artifact@v4
        with:
          name: cst-invoice-dev-encrypted-envelope-synthetic
          path: ${{ runner.temp }}/cst-invoice-dev-envelope-qa/
          if-no-files-found: error
          retention-days: 1
