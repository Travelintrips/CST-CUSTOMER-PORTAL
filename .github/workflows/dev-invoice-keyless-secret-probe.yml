name: CST Invoice DEV — keyless Secret Manager IAM proof

on:
  push:
    branches:
      - test/dev-customer-invoice-gcp-secret-reader-20261119
    paths:
      - .github/workflows/dev-invoice-keyless-secret-probe.yml

permissions:
  contents: read
  id-token: write

jobs:
  proof-no-static-service-account-key:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/test/dev-customer-invoice-gcp-secret-reader-20261119' &&
      github.repository == 'Travelintrips/CST-CUSTOMER-PORTAL' &&
      github.event.repository.id == 1369747600
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch-only source
        uses: actions/checkout@v4

      - name: Google Cloud keyless OAuth via strictly scoped GitHub OIDC
        id: keyless
        uses: google-github-actions/auth@v3
        with:
          project_id: secret-504012
          workload_identity_provider: projects/653506647312/locations/global/workloadIdentityPools/fleet-dev-github/providers/customer-invoice-dev-oidc
          service_account: bizportal-invoice-dev-reader@secret-504012.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify resource-only permissions without reading secrets
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.keyless.outputs.access_token }}
        run: |
          set -euo pipefail
          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "NO_KEYLESS_ACCESS_TOKEN"; exit 1
          fi
          p='projects/653506647312/secrets'
          permissions='{"permissions":["secretmanager.versions.access","secretmanager.versions.add"]}'
          invoice_response="$(curl --fail-with-body -sS --max-time 20 \
            -X POST "https://secretmanager.googleapis.com/v1/$p/bizportal-customer-invoice-writers-dev-companies:testIamPermissions" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$permissions")"
          finance_response="$(curl --fail-with-body -sS --max-time 20 \
            -X POST "https://secretmanager.googleapis.com/v1/$p/bizportal-marketplace-finance-dev-companies:testIamPermissions" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$permissions")"
          INVOICE_PERMISSIONS="$invoice_response" FINANCE_PERMISSIONS="$finance_response" python3 - <<'PY'
          import json, os
          own = set(json.loads(os.environ['INVOICE_PERMISSIONS']).get('permissions', []))
          other = set(json.loads(os.environ['FINANCE_PERMISSIONS']).get('permissions', []))
          assert 'secretmanager.versions.access' in own, 'dedicated Invoice read missing'
          assert 'secretmanager.versions.add' not in own, 'Invoice write wrongly allowed'
          assert not other, 'dedicated Invoice identity gained Finance secret access'
          print('WIF_KEYLESS_INVOICE_ONLY_PERMISSIONS_PASS')
          print('NO_SECRET_PAYLOAD_READ')
          print('NO_SERVICE_ACCOUNT_KEY_CREATED')
          PY
