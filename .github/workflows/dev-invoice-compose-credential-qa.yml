name: CST Invoice DEV — Docker Compose credential isolation

on:
  push:
    branches:
      - test/dev-customer-invoice-systemd-keyless-delivery-20261119
    paths:
      - .github/workflows/dev-invoice-compose-credential-qa.yml
      - ops/dev-invoice-keyless-credentials.compose.override.yml
      - scripts/dev-invoice-compose-guard.sh
      - scripts/deploy-certified-vps.sh
      - scripts/tests/customer-invoice-compose-credential-override.qa.sh
  pull_request:
    paths:
      - .github/workflows/dev-invoice-compose-credential-qa.yml
      - ops/dev-invoice-keyless-credentials.compose.override.yml
      - scripts/dev-invoice-compose-guard.sh
      - scripts/deploy-certified-vps.sh
      - scripts/tests/customer-invoice-compose-credential-override.qa.sh

permissions:
  contents: read

jobs:
  verify-dormant-compose-override:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source-only candidate
        uses: actions/checkout@v4

      - name: Verify Docker Compose tool and generate synthetic DEV config
        shell: bash
        run: |
          set -euo pipefail
          docker compose version
          sudo install -d -m 0700 /etc/cst-customer-portal-dev
          printf '%s\n' CUSTOMER_PORTAL_ATOMIC_ACCOUNTING_POST_DEV=false \
            | sudo tee /etc/cst-customer-portal-dev/runtime.env >/dev/null
          sudo chmod 0600 /etc/cst-customer-portal-dev/runtime.env

      - name: Ensure only one optional credential bind changes original Compose
        shell: bash
        run: |
          set -euo pipefail
          sudo bash -n scripts/deploy-certified-vps.sh
          sudo bash -n scripts/dev-invoice-compose-guard.sh
          sudo bash -n scripts/tests/customer-invoice-compose-credential-override.qa.sh
          sudo bash scripts/tests/customer-invoice-compose-credential-override.qa.sh

      - name: Prove no Invoice secrets or database writer login were used
        shell: bash
        run: |
          echo COMPOSE_ONLY_STATIC_SOURCE_AND_SYNTHETIC_CREDENTIALS_QA_PASS
          echo NO_SECRET_MANAGER_PAYLOAD_READ
          echo NO_DATABASE_ROLE_CHANGED
          echo NO_PROD_DEPLOY
