name: DEV Customer Invoice — independently approved Admin company affiliation

on:
  pull_request:
    branches:
      - test/dev-invoice-admin-company-scope-gate-20261118
    paths:
      - 'server/billing-operations.mjs'
      - 'src/portal-customer-invoice-posted-ar-evidence.test.ts'
      - 'src/dev-admin-invoice-signed-http-isolated.test.ts'
      - '.github/workflows/dev-invoice-independently-approved-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-admin-company-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Signed Admin company approval and invoice rollback tests
        env:
          APP_ENV: development
          NODE_ENV: test
          SUPABASE_DATABASE_URL_DEV: postgresql://ci:ci@127.0.0.1:5432/ci
        run: pnpm exec vitest run src/dev-admin-invoice-signed-http-isolated.test.ts src/portal-customer-invoice-posted-ar-evidence.test.ts
      - name: TypeScript and server syntax
        run: |
          pnpm run typecheck
          pnpm run verify:server-syntax
