    <!-- Inline error trap: runs synchronously before ANY module loads.
         Catches both sync throws (module eval failures) and unhandled promises.
         Will be removed once the production blank-page bug is identified. -->
    <script>
    (function () {
      function showErr(msg) {
        try {
          var el = document.getElementById('root');
          if (el) {
            el.innerHTML =
              '<div style="font-family:monospace;color:#b91c1c;background:#fef2f2;border:2px solid #fca5a5;border-radius:8px;padding:24px;margin:24px;white-space:pre-wrap;word-break:break-all">'
              + '<strong>⚠ App Startup Error (debug build)</strong>\n\n'
              + String(msg).replace(/</g,'&lt;').replace(/>/g,'&gt;')
              + '</div>';
          }
        } catch(e2) { /* ignore */ }
      }
      window.addEventListener('error', function (e) {
        showErr((e.error && e.error.stack) ? e.error.stack : (e.message + '\n' + e.filename + ':' + e.lineno));
      });
      window.addEventListener('unhandledrejection', function (e) {
        showErr('UnhandledRejection: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)));
      });
    })();
    </script>
